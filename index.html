<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FakeOS v0.4.0</title>
  <link rel="stylesheet" href="css/boot.css">
  <link rel="stylesheet" href="css/desktop.css">
  <link rel="stylesheet" href="css/window.css">
  <link rel="stylesheet" href="css/taskbar.css">
  <link rel="stylesheet" href="css/terminal.css">
  <link rel="stylesheet" href="css/effects.css">
</head>
<body>
  <!-- 启动屏幕 -->
  <div id="boot-screen">
    <div id="boot-text"></div>
  </div>

  <!-- 登录界面 -->
  <div id="login-screen" class="hidden">
    <div class="login-container">
      <div class="login-avatar">🤖</div>
      <div class="login-username">管理员</div>
      <input type="password" id="login-password" placeholder="输入密码..." autocomplete="off">
      <button id="login-btn">登 录</button>
      <div id="login-message"></div>
    </div>
  </div>

  <!-- 桌面 -->
  <div id="desktop" class="hidden">
    <div id="desktop-icons">
      <div class="desktop-icon" data-app="terminal" ondblclick="openApp('terminal')">
        <div class="icon-emoji">🖥️</div>
        <div class="icon-label">终端</div>
      </div>
      <div class="desktop-icon" data-app="fileManager" ondblclick="openApp('fileManager')">
        <div class="icon-emoji">📁</div>
        <div class="icon-label">文件管理器</div>
      </div>
      <div class="desktop-icon" data-app="chat" ondblclick="openApp('chat')">
        <div class="icon-emoji">💬</div>
        <div class="icon-label">聊天</div>
      </div>
      <div class="desktop-icon" data-app="settings" ondblclick="openApp('settings')">
        <div class="icon-emoji">⚙️</div>
        <div class="icon-label">设置</div>
      </div>
      <div class="desktop-icon" data-app="virus" id="virus-icon" ondblclick="openApp('virus')">
        <div class="icon-emoji">💀</div>
        <div class="icon-label">病毒.exe</div>
      </div>
      <div class="desktop-icon" data-app="notepad" ondblclick="openApp('notepad')">
        <div class="icon-emoji">📝</div>
        <div class="icon-label">记事本</div>
      </div>
      <div class="desktop-icon" data-app="calculator" ondblclick="openApp('calculator')">
        <div class="icon-emoji">🧮</div>
        <div class="icon-label">计算器</div>
      </div>
      <div class="desktop-icon" data-app="music" ondblclick="openApp('music')">
        <div class="icon-emoji">🎵</div>
        <div class="icon-label">音乐</div>
      </div>
      <div class="desktop-icon" data-app="weather" ondblclick="openApp('weather')">
        <div class="icon-emoji">🌤️</div>
        <div class="icon-label">天气</div>
      </div>
      <div class="desktop-icon" data-app="drawpad" ondblclick="openApp('drawpad')">
        <div class="icon-emoji">🎨</div>
        <div class="icon-label">画板</div>
      </div>
      <div class="desktop-icon" data-app="recycleBin" ondblclick="openApp('recycleBin')">
        <div class="icon-emoji">🗑️</div>
        <div class="icon-label">回收站</div>
      </div>
      <div class="desktop-icon" data-app="camera" ondblclick="openApp('camera')">
        <div class="icon-emoji">📡</div>
        <div class="icon-label">监控摄像头</div>
      </div>
      <div class="desktop-icon" data-app="systemLog" ondblclick="openApp('systemLog')">
        <div class="icon-emoji">📋</div>
        <div class="icon-label">系统日志</div>
      </div>
      <div class="desktop-icon" data-app="mirror" ondblclick="openApp('mirror')">
        <div class="icon-emoji">🪞</div>
        <div class="icon-label">镜像</div>
      </div></div>
    </div>

    <div id="windows-container"></div>

    <!-- 任务栏 -->
    <div id="taskbar">
      <button id="start-btn" onclick="toggleStartMenu()">开始</button>
      <div id="taskbar-apps"></div>
      <div id="taskbar-right">
        <span id="taskbar-clock"></span>
        <span id="taskbar-signal">📶</span>
        <span id="taskbar-battery">🔋 47%</span>
      </div>
    </div>

    <!-- 开始菜单 -->
    <div id="start-menu" class="hidden">
      <div class="start-menu-item" onclick="openApp('terminal')">🖥️ 终端</div>
      <div class="start-menu-item" onclick="openApp('fileManager')">📁 文件管理器</div>
      <div class="start-menu-item" onclick="openApp('chat')">💬 聊天</div>
      <div class="start-menu-item" onclick="openApp('settings')">⚙️ 设置</div>
      <div class="start-menu-divider"></div>
      <div class="start-menu-item" onclick="fakeShutdown()">⏻ 关机</div>
    </div>
  </div>

  <div id="overlay" class="hidden"></div>

  <script src="js/main.js"></script>
  <script src="js/window.js"></script>
  <script src="js/taskbar.js"></script>
  <script src="js/desktop.js"></script>
  <script src="js/terminal.js"></script>
  <script src="js/fileManager.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/settings.js"></script>
  <script src="js/virus.js"></script>
  <script src="js/shortcuts.js"></script>
  <script src="js/notifications.js"></script>
  <script src="js/notepad.js"></script>
  <script src="js/calculator.js"></script>
  <script src="js/easterEggs.js"></script>
  <script src="js/horror.js"></script>
  <script src="js/camera.js"></script>
  <script src="js/systemLog.js"></script>
  <script src="js/hiddenFolder.js"></script>
  <script src="js/mirror.js"></script>
  <script src="js/weather.js"></script>
  <script src="js/drawpad.js"></script>
  <script src="js/recycleBin.js"></script>
</body>
</html>
